name: Claude Security Audit

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to audit'
        required: true
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target_branch || github.ref }}
  cancel-in-progress: true
        
jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write  # For security findings
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install security tools
        run: |
          # Install Slither for Solidity analysis
          pip3 install slither-analyzer
          
          # Install cargo-audit for Rust dependencies
          cargo install cargo-audit
          
          # Install cargo-geiger for unsafe code detection
          cargo install cargo-geiger

      - name: Run preliminary security checks
        id: security-checks
        continue-on-error: true
        run: |
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          
          # Check for unsafe Rust code
          echo "### Unsafe Code Analysis" >> $GITHUB_STEP_SUMMARY
          cargo geiger --all-features >> $GITHUB_STEP_SUMMARY 2>&1 || echo "⚠️ Cargo geiger failed" >> $GITHUB_STEP_SUMMARY
          
          # Audit Rust dependencies
          echo "### Dependency Audit" >> $GITHUB_STEP_SUMMARY
          cargo audit >> $GITHUB_STEP_SUMMARY 2>&1 || echo "⚠️ Cargo audit found issues" >> $GITHUB_STEP_SUMMARY
          
          # Run Slither on contracts
          echo "### Slither Analysis" >> $GITHUB_STEP_SUMMARY
          # Point slither directly to the 'contracts' directory
          slither contracts --print human-summary >> $GITHUB_STEP_SUMMARY 2>&1 || echo "⚠️ Slither analysis failed" >> $GITHUB_STEP_SUMMARY
          
          # Generate SARIF output inside the 'contracts' directory
          slither contracts --sarif contracts/slither.sarif || true

      - name: Run Claude Security Audit
        id: claude-security-audit
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Use Claude Opus 4 for thorough security analysis
          model: "claude-opus-4-20250514"
          
          # Comprehensive security audit prompt
          direct_prompt: |
            ## CRITICAL SECURITY AUDIT for OP Succinct zkEVM
            
            This is a security-focused review of changes to critical components of a zkEVM proving system that secures millions of dollars.
            
            **SECURITY CHECKLIST:**
            
            ### For Solidity Contracts:
            1. **Access Control**: Verify all admin functions have proper modifiers
            2. **Reentrancy**: Check for state changes after external calls
            3. **Integer Overflow**: Ensure SafeMath or Solidity 0.8+ protections
            4. **Bond Handling**: Verify correct accounting of proposer/challenger bonds
            5. **Proof Verification**: Ensure SP1 proof verification cannot be bypassed
            6. **Game Resolution**: Check for edge cases in challenge/defense mechanics
            7. **Timestamp Dependencies**: Verify no manipulation via block.timestamp
            8. **Denial of Service**: Check for unbounded loops or gas griefing
            
            ### For Rust zkVM Programs:
            1. **Memory Safety**: Look for potential panics in proof generation
            2. **Determinism**: Ensure proof generation is fully deterministic
            3. **Input Validation**: Verify all external inputs are validated
            4. **Cryptographic Operations**: Check for proper use of hash functions
            5. **State Transition Logic**: Verify correctness of L2 state updates
            6. **Error Propagation**: Ensure errors don't leak sensitive info
            
            ### For Services (Proposer/Challenger):
            1. **Race Conditions**: Check for concurrent access to shared state
            2. **Network Security**: Verify proper handling of RPC failures
            3. **Key Management**: Ensure private keys are never logged/exposed
            4. **Retry Logic**: Check for potential infinite loops or DoS
            5. **Economic Attacks**: Verify bond amounts prevent griefing
            
            **SEVERITY LEVELS:**
            - 🔴 CRITICAL: Could lead to loss of funds or invalid state
            - 🟠 HIGH: Could disrupt system operation or leak sensitive data
            - 🟡 MEDIUM: Could cause unexpected behavior or gas inefficiency
            - 🟢 LOW: Best practice violations or minor issues
            
            **IMPORTANT**: This system verifies the correctness of an entire L2 blockchain. 
            A single vulnerability could compromise the integrity of all L2 transactions.
            
            Review with extreme thoroughness. Report ALL potential security issues, no matter how unlikely.
            Focus especially on:
            1. Bond theft opportunities
            2. Invalid proof acceptance
            3. State transition corruption
            4. Griefing attacks via gas consumption
            5. Timing attacks on challenge windows

          # Enhanced security tools
          allowed_tools: |
            Bash(cd contracts && forge test -vvv),
            Bash(cd contracts && slither .),
            Bash(cargo audit),
            Bash(cargo geiger),
            Read,
            Grep,
            Glob
          
          # Use sticky comments for tracking fixes (disabled for manual runs)
          use_sticky_comment: false
          
          # Security-focused environment
          claude_env: |
            RUST_BACKTRACE: full
            RUST_LOG: debug
            SP1_PROVER: mock

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: contracts/slither.sarif
          category: slither-analysis