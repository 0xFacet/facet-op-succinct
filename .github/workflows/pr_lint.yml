name: PR Lint

on:
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  main:
    name: Title
    runs-on:
      - runs-on
      - runner=1cpu-linux-x64
      - run-id=${{ github.run_id }} 
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
