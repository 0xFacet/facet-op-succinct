name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
    
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          
          # Use Claude Opus 4 for complex zkEVM tasks
          model: "claude-opus-4-20250514"
          
          # Allow Claude to run project-specific commands
          allowed_tools: |
            Bash(ls:*),
            Bash(pwd:*),
            Bash(cat:*),
            Bash(head:*),
            Bash(tail:*),
            Bash(rg:*),
            Bash(find:*),
            Bash(jq:*),
            Bash(wc:*),
            Bash(awk:*),
            Read,
            Write,
            Edit,
            MultiEdit,
            Grep,
            Glob,
            LS,
            WebSearch,
            WebFetch
          custom_instructions: |
            You are reviewing code for a modified version of OP Succinct that integrates fault and validity proofs in a single contract.
            
            Please review this pull request with special attention to:
            
            **For Rust code (*.rs):**
            - Memory safety and potential panics in zkVM programs
            - Correctness of proof generation logic
            - Performance optimizations for SP1 circuits
            - Proper error handling in fault-proof components
            - Integration with Kona (v1.0.1) for state transitions
            
            **For Solidity contracts (*.sol):**
            - Security vulnerabilities (reentrancy, overflow, access control)
            - Gas optimization opportunities
            - Correct handling of bonds and game resolution
            - Proper verification of ZK proofs on-chain
            
            **General concerns:**
            - Cryptographic correctness and security
            - Proper handling of L1/L2 state synchronization
            - Test coverage for critical paths
            
            Context: This system handles millions of dollars in bonds and must maintain perfect correctness to prevent invalid state transitions on L2.
            
            Be thorough but constructive. Prioritize security and correctness issues.