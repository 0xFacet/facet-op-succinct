name: Claude Code Review

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Run for all PRs, but with different review levels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read  # Allow reading CI results
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Use Claude Opus 4 for critical security reviews
          model: "claude-opus-4-20250514"
          
          # Project-specific review prompt for zkEVM proving system
          direct_prompt: |
            You are reviewing code for a modified version of OP Succinct that integrates fault and validity proofs in a single contract.
            
            Please review this pull request with special attention to:
            
            **For Rust code (*.rs):**
            - Memory safety and potential panics in zkVM programs
            - Correctness of proof generation logic
            - Performance optimizations for SP1 circuits
            - Proper error handling in fault-proof components
            - Integration with Kona (v1.0.1) for state transitions
            
            **For Solidity contracts (*.sol):**
            - Security vulnerabilities (reentrancy, overflow, access control)
            - Gas optimization opportunities
            - Correct handling of bonds and game resolution
            - Proper verification of ZK proofs on-chain
            
            **General concerns:**
            - Cryptographic correctness and security
            - Proper handling of L1/L2 state synchronization
            - Test coverage for critical paths
            
            Context: This system handles millions of dollars in bonds and must maintain perfect correctness to prevent invalid state transitions on L2.
            
            Be thorough but constructive. Prioritize security and correctness issues.

          # Use sticky comments to avoid duplicate reviews on force pushes
          use_sticky_comment: true
          
          # Allow Claude to run tests and checks
          allowed_tools: |
            Bash(cd contracts && forge test),
            Bash(cd contracts && forge fmt --check),
            Bash(ls:*),
            Bash(pwd:*),
            Bash(cat:*),
            Bash(head:*),
            Bash(tail:*),
            Bash(grep:*),
            Bash(rg:*),
            Bash(find:*),
            Bash(jq:*),
            Bash(wc:*),
            Bash(awk:*),
            Read,
            Grep,
            Glob,
            LS,
            WebSearch,
            WebFetch
          
          # Additional permissions for reading CI results
          additional_permissions: |
            actions: read

